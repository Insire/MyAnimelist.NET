# Runs the Cake "Default" target: tests with coverage, Codecov upload, release notes, pack, push to nuget.org, and tag.
# Cake also publishes the test results, the packages and the release notes to this run (Azure logging commands), so there are no publish steps here.
# Every build of main or a v<major>.<minor> branch is a public release (see version.json) and gets pushed.
# The GitHub service connection used for the checkout needs write access to the repository, to push the v<version> tag.
#
# Pull requests build too, but never publish: they get no nuget.org key and no push credentials, and their ref isn't a public release.
# They do get the Codecov token and upload coverage, so Codecov can comment on the pull request and report its (informational) checks.
# Builds of forks only run after approval, and only for pull requests against this repository. Pushes in a fork, to its own branches, never trigger this pipeline.
# That gate isn't part of the YAML. In Azure DevOps, under Edit > Triggers > Pull request validation, set:
#   - "Build pull requests from forks of this repository": on
#   - "Make secrets available to builds of forks": OFF (fork code could read them)
#   - "Require a team member's comment before building a pull request": on (builds start after "/AzurePipelines run" from a team member)
# Without secrets, a fork build can't log in to MAL: Cake then runs the unit tests only, logs a warning and skips the Codecov upload. Run the integration tests locally before approving.
#
# Needs a variable group named "SoftThorn.MAL.ApiClient" with these variables (mark all of them as secret):
#   NUGETORG_APIKEY   nuget.org API key with push rights for SoftThorn.MAL.ApiClient
#   CODECOV_TOKEN     Codecov upload token
#   MAL_CLIENT_ID     Client ID of the MyAnimeList API client used by the integration tests
#   MAL_REDIRECT_URL  Redirect URL registered for that client, e.g. http://localhost:5000/callback/
#   MAL_USERNAME      MyAnimeList test account
#   MAL_PASSWORD      Password of the test account

trigger:
  branches:
    include:
      - main
      - v*.*

pr:
  branches:
    include:
      - main
      - v*.*

pool:
  vmImage: ubuntu-latest

variables:
  - group: SoftThorn.MAL.ApiClient
  - name: DOTNET_NOLOGO
    value: true
  - name: DOTNET_CLI_TELEMETRY_OPTOUT
    value: true
  - name: DiffEngine_Disabled
    value: true

jobs:
  - job: Build
    displayName: Build, test and release
    # A normal run takes a few minutes (the integration tests about 20s). The limit stops a hung run, e.g. on a request MAL never answers.
    timeoutInMinutes: 30
    cancelTimeoutInMinutes: 5
    # Runs every step in Microsoft's Playwright image: .NET 10 SDK (dotnet/sdk:10.0-noble), pwsh, git and the browsers with their system libraries.
    # The tag must match the Microsoft.Playwright.Xunit.v3 version in Directory.Packages.props, or the tests won't find their browser.
    container: mcr.microsoft.com/playwright/dotnet:v1.63.0-noble
    steps:
      - checkout: self
        fetchDepth: 0 # Nerdbank.GitVersioning needs the full history, the release notes need the tags
        persistCredentials: ${{ ne(variables['Build.Reason'], 'PullRequest') }} # the Cake TagRelease task pushes the v<version> tag after a successful nuget.org push

      - pwsh: ./build.ps1
        displayName: Cake build
        env:
          # secret variables aren't exposed to scripts unless they are mapped explicitly
          ${{ if ne(variables['Build.Reason'], 'PullRequest') }}:
            NUGETORG_APIKEY: $(NUGETORG_APIKEY)
          # pull requests upload coverage too, for Codecov's PR comment and checks; the token can only upload reports
          CODECOV_TOKEN: $(CODECOV_TOKEN)
          ClientConfiguration__ClientId: $(MAL_CLIENT_ID)
          ClientConfiguration__RedirectUrl: $(MAL_REDIRECT_URL)
          MalAuthSettings__UserName: $(MAL_USERNAME)
          MalAuthSettings__Password: $(MAL_PASSWORD)
