# Runs the Cake "Default" target: tests with coverage, Codecov upload, release notes, pack, push to nuget.org, and tag.
# Every build of main or a v<major>.<minor> branch is a public release (see version.json) and gets pushed.
# The GitHub service connection used for the checkout needs write access to the repository, to push the v<version> tag.
#
# Needs a variable group named "MyAnimelist.NET" with these variables (mark all of them as secret):
#   NUGETORG_APIKEY   nuget.org API key with push rights for MyAnimelist.NET
#   CODECOV_TOKEN     Codecov upload token
#   MAL_CLIENT_ID     Client ID of the MyAnimeList API client used by the integration tests
#   MAL_REDIRECT_URL  Redirect URL registered for that client, e.g. http://localhost:5000/callback/
#   MAL_USERNAME      MyAnimeList test account
#   MAL_PASSWORD      Password of the test account

trigger:
  branches:
    include:
      - main
      - v*.*

# The integration tests need the secrets, which Azure Pipelines doesn't pass to builds of pull requests from forks
pr: none

pool:
  vmImage: windows-latest

variables:
  - group: MyAnimelist.NET
  - name: DOTNET_NOLOGO
    value: true
  - name: DOTNET_CLI_TELEMETRY_OPTOUT
    value: true
  - name: DiffEngine_Disabled
    value: true

steps:
  - checkout: self
    fetchDepth: 0 # Nerdbank.GitVersioning and GitVersion need the full history, the release notes need the tags
    persistCredentials: true # the Cake TagRelease task pushes the v<version> tag after a successful nuget.org push

  - task: UseDotNet@2
    displayName: Install .NET 10 SDK
    inputs:
      packageType: sdk
      version: 10.0.x

  # Playwright keeps its browsers in the user profile, so they survive the clean in the Cake build
  - pwsh: |
      dotnet build tests/MyAnimelist.NET.IntegrationTests/MyAnimelist.NET.IntegrationTests.csproj --configuration Release
      ./tests/MyAnimelist.NET.IntegrationTests/bin/Release/net10.0/playwright.ps1 install chromium
    displayName: Install Playwright browsers

  - pwsh: ./build.ps1
    displayName: Cake build
    env:
      # secret variables aren't exposed to scripts unless they are mapped explicitly
      NUGETORG_APIKEY: $(NUGETORG_APIKEY)
      CODECOV_TOKEN: $(CODECOV_TOKEN)
      ClientConfiguration__ClientId: $(MAL_CLIENT_ID)
      ClientConfiguration__RedirectUrl: $(MAL_REDIRECT_URL)
      MalAuthSettings__UserName: $(MAL_USERNAME)
      MalAuthSettings__Password: $(MAL_PASSWORD)

  - task: PublishTestResults@2
    displayName: Publish test results
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: VSTest
      testResultsFiles: tmp_build/results/reports/cobertura/**/*.trx
      failTaskOnMissingResultsFile: false

  - task: PublishPipelineArtifact@1
    displayName: Publish packages
    condition: succeeded()
    inputs:
      targetPath: tmp_build/packages
      artifact: packages

  - task: PublishPipelineArtifact@1
    displayName: Publish release notes
    condition: succeeded()
    inputs:
      targetPath: tmp_build/results/release-notes.md
      artifact: release-notes
