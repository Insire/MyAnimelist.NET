codecov:
  require_ci_to_pass: yes

coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    # report on pull requests without blocking them, for now
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "reach,diff,tree"
  behavior: default
  require_changes: no

fixes:
  - "./a/1/s/::" # Windows agents
  - "/__w/1/s/::" # Linux container jobs
